<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="theme-color" content="#000000">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	background-color: black;
}

body {
	color: white;
	overflow: hidden;
	touch-action: none;
	position: fixed; /* stops iOS rubber-banding / address-bar jiggle */
	inset: 0;
}

/* Pin the canvas to the real visible viewport so no black band is left under it (dvh follows the browser bars). */
#canvas {
	display: block;
	position: fixed;
	left: 0;
	top: 0;
	width: 100vw !important;
	width: 100dvw !important;
	height: 100vh !important;
	height: 100dvh !important;
}

#fs-button {
	position: fixed;
	top: calc(env(safe-area-inset-top, 0px) + 8px);
	left: 50%;
	transform: translateX(-50%);
	z-index: 5;
	display: none;
	padding: 6px 14px;
	font: 600 14px/1 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	color: #fff;
	background: rgba(0, 0, 0, 0.55);
	border: 1px solid rgba(255, 255, 255, 0.5);
	border-radius: 999px;
	touch-action: manipulation;
}

#fs-hint {
	position: fixed;
	left: 50%;
	top: 50%;
	transform: translate(-50%, -50%);
	z-index: 6;
	display: none;
	max-width: 80%;
	padding: 16px 20px;
	text-align: center;
	font: 15px/1.4 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	color: #fff;
	background: rgba(0, 0, 0, 0.85);
	border: 1px solid rgba(255, 255, 255, 0.5);
	border-radius: 12px;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<button id="fs-button" type="button">&#9974; Fullscreen</button>
		<div id="fs-hint"></div>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());

// Fullscreen button + keep the engine canvas in sync with the visible viewport.
(function () {
	const button = document.getElementById('fs-button');
	const hint = document.getElementById('fs-hint');
	const root = document.documentElement;
	const requestFs = root.requestFullscreen || root.webkitRequestFullscreen;
	const isFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
	const isStandalone = () => window.navigator.standalone === true || window.matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
	const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

	function refresh() {
		// Nothing to offer once fullscreen or installed; iPhone Safari has no Fullscreen API so we show how to install instead.
		button.style.display = (isFullscreen() || isStandalone() || (!requestFs && !isIos)) ? 'none' : 'block';
	}

	function nudgeResize() {
		window.dispatchEvent(new Event('resize'));
	}

	button.addEventListener('click', function () {
		if (requestFs) {
			const p = requestFs.call(root);
			Promise.resolve(p).then(function () {
				if (screen.orientation && screen.orientation.lock) {
					screen.orientation.lock('landscape').catch(function () {});
				}
			}).catch(function () {});
		} else {
			hint.innerHTML = 'iPhone Safari cannot go fullscreen from a web page.<br>Tap <b>Share</b> &rarr; <b>Add to Home Screen</b>, then launch the game from the icon.<br><br>(Tap to close)';
			hint.style.display = 'block';
		}
	});
	hint.addEventListener('click', function () { hint.style.display = 'none'; });

	document.addEventListener('fullscreenchange', function () { refresh(); nudgeResize(); });
	document.addEventListener('webkitfullscreenchange', function () { refresh(); nudgeResize(); });
	window.addEventListener('orientationchange', function () { setTimeout(nudgeResize, 300); });
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', nudgeResize);
	}
	refresh();
}());
		</script>
	</body>
</html>
